services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  ui:
    build: .
    env_file: .env
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  # Optional local open-source model. Requires an NVIDIA GPU host.
  #   docker compose --profile local-model up --build
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [local-model]
    command: --model ${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct} --host 0.0.0.0 --enable-auto-tool-choice --tool-call-parser llama3_json
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
